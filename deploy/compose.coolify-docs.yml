# Magnemite on Coolify, with the documentation site.
#
# This is `docker-compose.coolify.yml` plus one service: `docs`, the Fumadocs
# site under apps/docs. Coolify deploys a Compose resource as a single file, so
# the whole stack is repeated here rather than layered -- use *either* this file
# *or* the plain one, never both against the same resource.
#
# The docs site shares nothing with the stack: no database, no secrets, no
# volume. It is here so it deploys from the same repository and gets a domain
# from the same place, and it can be rebuilt at any time without touching the
# fleet (see the Custom Build/Start Command note below).
#
# It needs a third domain:
#
#   SERVICE_FQDN_DOCS  -> the docs people read, e.g. docs.<your-domain>
#
# Give it the `:3002` suffix in the Domains tab so Coolify's proxy hits Next's
# port.
#
# Deploying only the docs, once the stack is up (General tab):
#   Custom Build Command:  docker compose build docs
#   Custom Start Command:  docker compose up -d --no-deps docs
#
# ---------------------------------------------------------------------------
#
# Magnemite on Coolify.
#
# Coolify's proxy terminates TLS and routes to the containers, so there is no
# Caddy in front of the whole stack. There is still one in front of the hub:
# Traefik is a reverse proxy, not a file server, and it cannot mount our
# artifacts volume, so the `edge` service serves the ~170 MB bundles straight
# off that volume and keeps Node out of the data path.
#
# Two domains are used instead of path routing, because the agents and the
# dashboard are separate audiences:
#
#   SERVICE_FQDN_WEB   -> the dashboard people log into
#   SERVICE_FQDN_EDGE  -> what the boxes talk to: /ws/device, /api/enroll
#                         and /files/*
#
# Coolify replaces every SERVICE_* placeholder on first deploy and shows the
# generated values (domains, passwords) in the app's Environment tab. Point the
# edge domain at a subdomain such as agents.<your-domain>.
#
# Deploying: New Resource -> Docker Compose -> point it at this file, set the
# two domains, then deploy. The admin login (admin@magnemite.com by default,
# password generated by Coolify and shown in the Environment tab) is created
# automatically the moment the hub boots -- nothing to run by hand. Optionally
# seed a starter app target, sources and device group:
#   docker exec -it <hub-container> pnpm --filter @magnemite/db run seed
#
# Upgrading from an earlier version of this file: the hub domain moved from
# SERVICE_FQDN_HUB_3001 to SERVICE_FQDN_EDGE. Keep the same domain value and
# the fleet needs no re-flashing -- the boxes only know the URL.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-magnemite}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-magnemite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SERVICE_USER_POSTGRES:-magnemite} -d ${POSTGRES_DB:-magnemite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-magnemite}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-magnemite}?schema=public
      HUB_PORT: 3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
      # Artifact URLs handed to the boxes are built from this, so it has to be
      # the domain the boxes reach -- the edge's, not the dashboard's.
      MAGNEMITE_PUBLIC_URL: ${SERVICE_URL_EDGE}
      ARTIFACT_DIR: /data/artifacts
      # The edge serves /files/* off the shared volume, so Node never does.
      SERVE_ARTIFACTS: "false"
      # The hub image carries the agent binaries it was built with and updates
      # the fleet to them as boxes reconnect. Set to "false" to pin the agents
      # and drive updates by hand instead.
      AGENT_AUTO_UPDATE: ${AGENT_AUTO_UPDATE:-true}
      AGENT_UPDATE_CONCURRENCY: ${AGENT_UPDATE_CONCURRENCY:-5}
      ROTOM_ENABLED: ${ROTOM_ENABLED:-false}
      ROTOM_URL: ${ROTOM_URL:-}
      ROTOM_SECRET: ${ROTOM_SECRET:-}
      # The hub syncs the admin account to these on every boot, and there is no
      # .env file inside this container -- without them it would fall back to
      # its own defaults and create admin@example.com with a well-known
      # password.
      #
      # The password is generated by Coolify like the other SERVICE_PASSWORD_*
      # values and shown in the Environment tab; read it from there to log in
      # the first time. The email is only a login identifier -- nothing is ever
      # sent to it -- so the default is fine until you want your own.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@magnemite.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The piece Coolify's proxy cannot be: a file server with the artifacts
  # volume mounted. Everything the boxes touch goes through here.
  edge:
    build:
      # Built rather than pulled, so the Caddyfile travels inside the image.
      # Coolify turns a file bind mount into a mount of its own, which means
      # the config in the container is the copy on the server rather than the
      # one in this repository — and a stale one 404s a new route with nothing
      # obviously wrong.
      context: ./edge
      args:
        CADDYFILE: Caddyfile.coolify
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_started
    environment:
      # Declared with no value on purpose: Coolify fills this from the
      # service's Domains tab. Writing `${SERVICE_FQDN_EDGE}` here would make
      # Compose interpolate a variable that does not exist yet and blank it
      # out. A list-form bare entry (`- SERVICE_FQDN_EDGE`) means the same
      # thing but Coolify's own compose preview mis-converts it into a
      # numeric map key, which fails with "non-string key in
      # services.edge.environment: 0" -- use map form instead.
      # Use a subdomain such as agents.<your-domain>, and give the domain the
      # `:8080` suffix in the Domains tab so the proxy hits Caddy's port.
      SERVICE_FQDN_EDGE:
      HUB_PORT: 3001
    volumes:
      # Read-only: Caddy streams the cached .apkm files straight off here, so
      # the ~35 GB of a full rollout never passes through Node.
      - artifacts:/srv/artifacts:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    environment:
      # No value, like the edge one above: Coolify fills this from the
      # Domains tab, and the container gets the dashboard's domain under this
      # name. It is also the safety net for the auth URLs below:
      # `${SERVICE_URL_WEB}` is not always populated by the time Compose
      # interpolates it, and when it is not, the reference collapses to an
      # empty string. The app falls back to SERVICE_FQDN_WEB, so keep this
      # line even if you set the two explicitly. Map form (not a bare list
      # item) so Coolify's compose preview doesn't mis-key it -- see the edge
      # service's comment.
      SERVICE_FQDN_WEB:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-magnemite}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-magnemite}?schema=public
      # Better Auth signs and validates cookies against these two.
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      MAGNEMITE_PUBLIC_URL: ${SERVICE_URL_EDGE}
      MAGNEMITE_DASHBOARD_URL: ${SERVICE_URL_WEB}
      HUB_URL: http://hub:3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@magnemite.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # The documentation site. Static Fumadocs pages built at image build time --
  # nothing to configure, nothing to back up, and no dependency on the rest of
  # the stack, so `up -d --no-deps docs` is always safe.
  docs:
    build:
      context: ..
      dockerfile: apps/docs/Dockerfile
    restart: unless-stopped
    environment:
      # Declared with no value, like the two above: Coolify fills this from
      # the Domains tab. Use a subdomain such as docs.<your-domain>, and give
      # the domain the `:3002` suffix there so the proxy hits Next's port.
      # Map form, not a bare list item -- see the edge service's comment.
      SERVICE_FQDN_DOCS:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  artifacts:
  caddy_data:
  caddy_config:
