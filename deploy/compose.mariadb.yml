# Same stack as compose.yml, with MariaDB instead of Postgres. Prisma's
# "mysql" connector speaks MariaDB's wire protocol too, so DB_PROVIDER=mysql
# is all the hub and web images need to point at it instead — see
# packages/db/prisma.config.ts.
#
# Use it exactly like the default file:
#   docker compose --env-file .env -f deploy/compose.mariadb.yml up -d --build

name: magnemite

services:
  mariadb:
    image: mariadb:11
    container_name: magnemite-mariadb
    restart: unless-stopped
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      # Nothing here ever connects as root; a random one it is.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadbdata:/var/lib/mysql
    ports:
      # Host-only, so you can point Prisma Studio or a mysql client at it.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
      # The Prisma Client baked into the image at build time has to match the
      # DATABASE_URL below, so this is a build arg, not just a runtime one.
      args:
        DB_PROVIDER: mysql
    container_name: magnemite-hub
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_PROVIDER: mysql
      # Built from the DB_* vars rather than taken from .env, whose
      # DATABASE_URL points at the host-mapped port for local development.
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      HUB_PORT: ${HUB_PORT:-3001}
      HUB_INTERNAL_SECRET: ${HUB_INTERNAL_SECRET}
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL}
      # Container path, deliberately not taken from .env — it has to match the
      # volume mounted into caddy as /srv/artifacts.
      ARTIFACT_DIR: /data/artifacts
      # The hub image carries the agent binaries it was built with and updates
      # the fleet to them as boxes reconnect. Set to "false" to pin the agents
      # and drive updates by hand instead.
      AGENT_AUTO_UPDATE: ${AGENT_AUTO_UPDATE:-true}
      AGENT_UPDATE_CONCURRENCY: ${AGENT_UPDATE_CONCURRENCY:-5}
      ROTOM_ENABLED: ${ROTOM_ENABLED:-false}
      ROTOM_URL: ${ROTOM_URL:-}
      ROTOM_SECRET: ${ROTOM_SECRET:-}
    volumes:
      - artifacts:/data/artifacts
    expose:
      - "3001"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # The Prisma Client baked into the image at build time has to match the
      # DATABASE_URL below, so this is a build arg, not just a runtime one.
      args:
        DB_PROVIDER: mysql
    container_name: magnemite-web
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      hub:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_PROVIDER: mysql
      # Built from the DB_* vars rather than taken from .env, whose
      # DATABASE_URL points at the host-mapped port for local development.
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      # Behind Caddy the dashboard and the agents share one origin, so Better
      # Auth's origin check uses the same URL. The Coolify setup splits them.
      MAGNEMITE_DASHBOARD_URL: ${MAGNEMITE_PUBLIC_URL}
      BETTER_AUTH_URL: ${MAGNEMITE_PUBLIC_URL}
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL}
      HUB_URL: http://hub:${HUB_PORT:-3001}
      HUB_INTERNAL_SECRET: ${HUB_INTERNAL_SECRET}
    expose:
      - "3000"

  caddy:
    build:
      # Built rather than pulled, so the Caddyfile travels inside the image:
      # a bind-mounted config is one more thing that has to be in the right
      # state on the server, and a stale one 404s a new route with nothing
      # obviously wrong.
      context: ./edge
    container_name: magnemite-caddy
    restart: unless-stopped
    depends_on:
      - web
      - hub
    environment:
      HUB_PORT: ${HUB_PORT:-3001}
    ports:
      # Plain HTTP: your own reverse proxy terminates TLS and forwards here.
      - "${EDGE_PORT:-8080}:8080"
    volumes:
      # Caddy streams the cached .apkm files straight off this volume, so the
      # ~35 GB of a full rollout never touches Node.
      - artifacts:/srv/artifacts:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mariadbdata:
  artifacts:
  caddy_data:
  caddy_config:
