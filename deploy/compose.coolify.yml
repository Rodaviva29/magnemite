# Magnemite on Coolify.
#
# Coolify's proxy terminates TLS and routes to the containers, so there is no
# Caddy in front of the whole stack. There is still one in front of the hub:
# Traefik is a reverse proxy, not a file server, and it cannot mount our
# artifacts volume, so the `edge` service serves the ~170 MB bundles straight
# off that volume and keeps Node out of the data path.
#
# Two domains are used instead of path routing, because the agents and the
# dashboard are separate audiences:
#
#   SERVICE_FQDN_WEB   -> the dashboard people log into
#   SERVICE_FQDN_EDGE  -> what the boxes talk to: /ws/device, /api/enroll
#                         and /files/*
#
# The database is MariaDB, reached through Prisma's "mysql" connector -- there
# is no separate mariadb provider. DB_PROVIDER=mysql is set as a build arg on
# hub and web because the Prisma Client is generated into those images, and as
# a runtime one because the hub's entrypoint applies prisma/migrations-mysql
# from it. The two migration histories are separate and there is no data copy
# between providers: an existing Postgres deployment does not become this one
# by editing the file.
#
# Coolify replaces every SERVICE_* placeholder on first deploy and shows the
# generated values (domains, passwords) in the app's Environment tab. Point the
# edge domain at a subdomain such as agents.<your-domain>. The container port
# each domain routes to is the numeric suffix on the SERVICE_URL_* name, so
# nothing needs a `:port` typed into the Domains tab.
#
# Deploying: New Resource -> Docker Compose -> point it at this file, set the
# two domains, then deploy. The admin login (admin@magnemite.com by default,
# password generated by Coolify and shown in the Environment tab) is created
# automatically the moment the hub boots -- nothing to run by hand.
#
# Upgrading from an earlier version of this file: the hub domain moved from
# SERVICE_FQDN_HUB_3001 to SERVICE_URL_EDGE_8080 (via SERVICE_FQDN_EDGE). Keep
# the same domain value and the fleet needs no re-flashing -- the boxes only
# know the URL. Coming from SERVICE_FQDN_EDGE, drop the `:8080` the Domains tab
# used to need: the name carries the port now.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: ${SERVICE_USER_MARIADB:-magnemite}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
      MARIADB_DATABASE: ${DB_NAME:-magnemite}
      # Nothing here ever connects as root; a random one it is.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      # Ships with the image, and --innodb_initialized is the part that makes
      # `service_healthy` mean "ready for a migration", not just "port open".
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
      # The Prisma Client baked into the image at build time has to match the
      # DATABASE_URL below, so the provider is a build arg, not just a runtime
      # one. It also picks the migration history the entrypoint applies.
      args:
        DB_PROVIDER: mysql
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://${SERVICE_USER_MARIADB:-magnemite}:${SERVICE_PASSWORD_MARIADB}@mariadb:3306/${DB_NAME:-magnemite}
      HUB_PORT: 3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
      # Artifact URLs handed to the boxes are built from this, so it has to be
      # the domain the boxes reach -- the edge's, not the dashboard's.
      MAGNEMITE_PUBLIC_URL: ${SERVICE_URL_EDGE}
      ARTIFACT_DIR: /data/artifacts
      # The edge serves /files/* off the shared volume, so Node never does.
      SERVE_ARTIFACTS: "false"
      # The hub image carries the agent binaries it was built with and updates
      # the fleet to them as boxes reconnect. Set to "false" to pin the agents
      # and drive updates by hand instead.
      AGENT_AUTO_UPDATE: ${AGENT_AUTO_UPDATE:-true}
      ROTOM_ENABLED: ${ROTOM_ENABLED:-false}
      ROTOM_URL: ${ROTOM_URL:-}
      ROTOM_SECRET: ${ROTOM_SECRET:-}
      # The hub syncs the admin account to these on every boot, and there is no
      # .env file inside this container -- without them it would fall back to
      # its own defaults and create admin@example.com with a well-known
      # password.
      #
      # The password is generated by Coolify like the other SERVICE_PASSWORD_*
      # values and shown in the Environment tab; read it from there to log in
      # the first time. The email is only a login identifier -- nothing is ever
      # sent to it -- so the default is fine until you want your own.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@magnemite.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The piece Coolify's proxy cannot be: a file server with the artifacts
  # volume mounted. Everything the boxes touch goes through here.
  edge:
    build:
      # Built rather than pulled, so the Caddyfile travels inside the image.
      # Coolify turns a file bind mount into a mount of its own, which means
      # the config in the container is the copy on the server rather than the
      # one in this repository — and a stale one 404s a new route with nothing
      # obviously wrong.
      context: ./edge
      args:
        CADDYFILE: Caddyfile.coolify
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_started
    environment:
      # Declared with no value on purpose: Coolify fills this from the
      # service's Domains tab. Writing `${SERVICE_URL_EDGE}` here would make
      # Compose interpolate a variable that does not exist yet and blank it
      # out. A list-form bare entry (`- SERVICE_URL_EDGE_8080`) means the same
      # thing but Coolify's own compose preview mis-converts it into a
      # numeric map key, which fails with "non-string key in
      # services.edge.environment: 0" -- use map form instead.
      #
      # The port belongs in the *name*. `_8080` is what tells the proxy which
      # container port this domain routes to, instead of the `:8080` suffix
      # having to be typed into the Domains tab. One declaration yields four
      # variables: SERVICE_URL_EDGE_8080 and SERVICE_FQDN_EDGE_8080, which
      # carry the port, and the generic SERVICE_URL_EDGE / SERVICE_FQDN_EDGE,
      # which do not -- the generic URL is what the hub hands to the boxes.
      #
      # Use a subdomain such as agents.<your-domain>.
      SERVICE_URL_EDGE_8080:
      HUB_PORT: 3001
    volumes:
      # Read-only: Caddy streams the cached .apkm files straight off here, so
      # the ~35 GB of a full rollout never passes through Node.
      - artifacts:/srv/artifacts:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Same as the hub: the Prisma Client is generated at image build time,
      # so the provider has to be set there too.
      args:
        DB_PROVIDER: mysql
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      hub:
        condition: service_started
    environment:
      # No value, like the edge one above, and the port in the name for the
      # same reason: Coolify fills this from the Domains tab and routes the
      # domain to Next's port. The declaration also puts the generic
      # SERVICE_FQDN_WEB and SERVICE_URL_WEB in the container, which is the
      # safety net for the auth URLs below: `${SERVICE_URL_WEB}` is not always
      # populated by the time Compose interpolates it, and when it is not the
      # reference collapses to an empty string -- the app then falls back to
      # SERVICE_FQDN_WEB at runtime. Map form (not a bare list item) so
      # Coolify's compose preview doesn't mis-key it -- see the edge service's
      # comment.
      SERVICE_URL_WEB_3000:
      NODE_ENV: production
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://${SERVICE_USER_MARIADB:-magnemite}:${SERVICE_PASSWORD_MARIADB}@mariadb:3306/${DB_NAME:-magnemite}
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      MAGNEMITE_PUBLIC_URL: ${SERVICE_URL_EDGE}
      MAGNEMITE_DASHBOARD_URL: ${SERVICE_URL_WEB}
      HUB_URL: http://hub:3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mariadbdata:
  artifacts:
  caddy_data:
  caddy_config:
